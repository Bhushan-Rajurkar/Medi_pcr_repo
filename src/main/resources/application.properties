spring.application.name=Medi_PCR
# server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medi_pcr_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1.1}

# JWT Configuration
# Expiration is set to 24 hours (86400000 milliseconds)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Email.config
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${BREVO_USERNAME:}
spring.mail.password=${BREVO_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${BREVO_from_email:}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Application Base URL (used for generating links in emails)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Firebase Configuration File
firebase.config-path=${FIREBASE_CONFIG_PATH:classpath:my-medi-pcr-firebase-adminsdk-fbsvc-d963a4e80a.json}

# Cloudinary Configuration for Lab Reports
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
